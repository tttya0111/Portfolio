<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="card.css">
        <title>Card Payment</title>
    </head>
    <body>
        <header>
            <h1>Payment</h1>
        </header>
        <div class="container">
            <main>
                <form id="card" name="card">
                    <div class="nameBox">
                        <label for="name">Name:</label>
                        <input type="text" id="name">
                    </div>
                    <div class="cardNumberBox">
                        <label for="cardNumber">Card Number: </label>
                        <input type="text" id="cardNumber" placeholder="xxxx xxxxx xxxx xxxx">
                    </div>
                    <div class="expirationDateBox">
                        <label for="expirationDate">Expiration Date: </label>
                        <select id="expirationDateMonth">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                            <option value="10">10</option>
                            <option value="11">11</option>
                            <option value="12">12</option>
                        </select>
                        <select id="expirationDateYear">
                            <option value="2024">2024</option>
                            <option value="2025">2025</option>
                            <option value="2026">2026</option>
                            <option value="2027">2027</option>
                            <option value="2028">2028</option>
                            <option value="2029">2029</option>
                            <option value="2030">2030</option>
                            <option value="2031">2031</option>
                            <option value="2032">2032</option>
                            <option value="2033">2033</option>
                            <option value="2034">2034</option>
                            <option value="2035">2035</option>
                        </select>
                    </div>
                    <div class="cvvBox">
                        <label for="cvv">CVV: </label>
                        <input type="password" id="cvv">
                    </div>
                    <div class="button">
                        <input type="submit" value="Confirm Payment">
                        <input type="reset" value="Reset">
                        <input type="button" value="Cancel">
                    </div>
                </form>
            </main>
        </div>
        <script src="card.js"></script>
    </body>
</html>
