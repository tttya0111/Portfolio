<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="loginregister.css">
        <title>QYHome</title>
    </head>

    <body class="login">
        <header>
            <a href="index.html"><img src="Icon/Nav_Icon/logo.png" alt="QYHome logo"  width="190px" height="75px" style="margin-bottom:0; "></a>
        </header>
        <div class="loginreg-container">
            <div class="loginregister" id="plogin">
                <form>
                    <h1>USER LOGIN</h1>
                    <label for="phone"><h3>Phone Number</h3></label>
                    <input type="tel" placeholder="Enter Phone Number" name="phone" id="phone" required><br/>
                    <label for="password"><h3>Password</h3></label>
                    <div class="passwordwrapper">
                        <input type="password" placeholder="Enter Password" name="password" id="password" autocomplete="current-password">
                        <img src="Icon/LoginRegister/eyenotvisible.png" alt="invisibleeye" width="25px" height="25px" id="togglepassword1">
                    </div>
                    <br/><br/>
                    <a href="#" onclick=resetpassword1()>Forgot password?</a>
                    <br/><br/>
                    <div class="button">
                        <button type="submit" class="button1" onclick="validateLoginForm('plogin', event)">LOGIN</button>
                    </div>
                    <p id="loginmethod">Or login with:</p>
                    <div class="button">
                        <button class="switchbutton" data-form="phoneLogin" onclick="GoToEmailLogin(event)">Continue with email</button>
                    </div>
                    <p>Don't have an account? <a href="#" onclick="GoToPhoneRegistration()">Register Now</a></p>
                </form>
            </div>
        </div>
        <div class="popupForm2" id="step1">
            <form>
                <h1>Forgot Password</h1>
                <h2>Step 1</h2>
                <label for="phone"><h3>Enter Your Phone Number</h3></label>
                <input type="tel" placeholder="Phone Number" name="phone" id="phone" required><br/>
                <br/><br/>
                <div class="buttonoption">
                    <button type="submit" class="nextresetbtn" onclick="validatePasswordStep('step1', 'step2', event)">NEXT</button>
                </div>
            </form>
        </div>
        <div class="popupForm2" id="step2">
            <form>
                <h1>Reset Password</h1>
                <h2>Step 2</h2>
                <label for="resetpassword"><h3>Password</h3></label>
                <div class="passwordwrapper">
                    <input type="password" placeholder="Create New Password" name="resetpassword" id="resetpassword" autocomplete="current-password" required>
                    <img src="Icon/LoginRegister/eyenotvisible.png" alt="invisibleeye" width="25px" height="25px" id="togglepassword">
                </div>
                <div class="passwordrequirements-container">
                    <ul class="requirementsLayout1">
                        <li>One number</li>
                        <li>One uppercase letter</li>
                        <li>One lowercase letter</li>
                    </ul>
                    <ul class="requirementsLayout2">
                        <li>One special character</li>
                        <li>8 characters minimum</li>
                    </ul>
                </div>
                <label for="confirmpassword"><h3>Confirm Password</h3></label>
                <div class="passwordwrapper">
                    <input type="password" placeholder="Re-type password" name="confirmpassword" id="confirmpassword" autocomplete="current-password" required>
                    <img src="Icon/LoginRegister/eyenotvisible.png" alt="invisibleeye" width="25px" height="25px" id="togglepassword2">
                </div>
                <br/><br/>
                <div class="buttonoption">
                    <button type="button" class="previousbutton" onclick="resetpassword1()">Previous</button>
                    <button type="reset" class="nextresetbtn" onclick="validatePasswordStep('step2', null, event)">Reset</button>
                </div>
            </form>
        </div>
        <script src="login.js"></script>
        <script src="plogin.js"></script>
    </body>
</html>
