<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Payment Success</title>
        <style>
            body{
                background-image: url(paymentimg.jpeg);
                background-repeat: no-repeat;
                background-size: cover;
            }
            .container{
                width: 750px;
                height: 480px;
                background-color: hsl(255, 9%, 91%);
                margin-top: 10%;
                margin-bottom: 10%;
                margin-left: 27%;   
                margin-right: 27%; 
                box-shadow: -5px 5px 20px white;
                text-align: center;
                border-radius: 30px;
            }

            .container h1{
                margin-top: 2% ;
                float: right;
                opacity: 1.0;
                font-size: 4rem;
                font-style: italic;
                font-family: Georgia, 'Times New Roman', Times, serif;
                font-variant: small-caps;
                margin-left: 39%;
                color: #004f9b;
                position: relative;
                animation-timing-function: ease-in-out;
                animation: move 3s;
                animation-fill-mode: forwards;
            }

            @keyframes move {
                from {left: -1000px;}
                to {left: -140px;}
            }

            .container h3{
                margin-top: -60px ;
                text-align: center;
                opacity: 1.0;
                font-size: 2.3rem;
                font-style: italic;
                font-family: Impact, fantasy;
                font-variant: small-caps;
                font-weight: 100;
                margin-left: 39%;
                color: #4F5559;
                position: relative;
                animation-timing-function: ease-in-out;
                animation: moveright 4s;
                animation-fill-mode: forwards;
            }

            @keyframes moveright {
                from {right: -1000px;}
                to {right: 125px;}
            }

            .container .button{
                width: 50%;
                height: 15%;
                border-radius: 50px;
                font-weight: bolder;
                border: 2px solid;
                font-size: 1.5rem;
                text-align: center;
                padding-top: 25px;
                padding-bottom: 50px;
                color: #dedede;
                cursor: pointer;
                text-transform: uppercase;
                font-family: "Comic Sans MS", "Comic Sans", cursive;
                background-color: #004F9B;
            }

            .container .button:hover , .container .button:active{
                background-color: #94DAFF;
                color: black;
                border: none;
                
            }


            @media screen and (max-width:1024px) {
                .container{
                    width: 650px;
                    height: 500px;
                    background-color: #cfdee7;
                    margin-top: 20%;
                    margin-left: 17.5%;
                    box-shadow: -5px 5px 20px hsl(214, 24%, 60%);
                }


        
                header h1{
                    margin-left: 34%;
                }
            }

        </style>
    </head>
    <body>
        <div class="container">
            <h1>Thank You For Purchase</h1>
            <h3>Welcome To Visit Us Again</h3>
            <button class="button"> Back To Home Page </button>
        </div>

        <script>
            // Select the button element
            let backButton = document.querySelector('.button');

            // Add click event listener to the button
            backButton.addEventListener('click', () => {
                // Navigate to the index.html page
                window.location.href = 'index.html';
            });
        </script>
    </body>
</html>
